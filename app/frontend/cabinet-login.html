<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход в кабинет | Lunet</title>
  <meta name="description" content="Вход в веб-кабинет Lunet по коду из email или Telegram." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/miniapp/cabinet-auth.css?v=21" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-layout">
      <section class="auth-card" aria-label="Авторизация">
        <div class="auth-card__brand">
          <img class="auth-card__logo" src="/miniapp/assets/lunet-logo-sign.png" alt="Lunet" />
        </div>
        <div class="auth-card__head">
          <h2>Вход в кабинет</h2>
        </div>

        <div class="auth-switch" role="tablist" aria-label="Способ входа">
          <button id="tab_email" class="tab is-active" type="button" role="tab" aria-selected="true">Код на email</button>
          <button id="tab_telegram" class="tab" type="button" role="tab" aria-selected="false">Код в Telegram</button>
          <button id="tab_deeplink" class="tab" type="button" role="tab" aria-selected="false">Ссылка в Telegram</button>
        </div>

        <form id="form_email" class="auth-form" autocomplete="on">
          <div id="email_request_block" class="auth-step auth-step--request">
            <label class="field">
              <span>Email</span>
              <input id="email" type="email" placeholder="user@example.com" required />
            </label>
            <div class="actions">
              <button id="send_email_code" class="btn" type="button">Отправить код</button>
            </div>
          </div>

          <div id="email_verify_block" class="auth-step auth-step--verify is-hidden">
            <label class="field">
              <span>Код</span>
              <input id="email_code" type="text" placeholder="Введите код" required />
            </label>
            <div class="actions">
              <button id="verify_email" class="btn" type="button">Войти по email</button>
            </div>
          </div>
        </form>

        <form id="form_telegram" class="auth-form is-hidden" autocomplete="off">
          <div id="tg_request_block" class="auth-step auth-step--request">
            <label class="field">
              <span>Telegram ID</span>
              <input id="tg_id" type="text" inputmode="numeric" placeholder="Например: 123456789" required />
            </label>
            <div class="actions">
              <button id="send_tg_code" class="btn" type="button">Отправить код в Telegram</button>
            </div>
          </div>

          <div id="tg_verify_block" class="auth-step auth-step--verify is-hidden">
            <label class="field">
              <span>Код</span>
              <input id="tg_code" type="text" placeholder="Введите код" required />
            </label>
            <div class="actions">
              <button id="verify_tg" class="btn" type="button">Войти по Telegram</button>
            </div>
          </div>
        </form>

        <form id="form_deeplink" class="auth-form is-hidden" autocomplete="off">
          <div class="auth-step auth-step--request">
            <label class="field">
              <span>Telegram ID</span>
              <input id="deeplink_tg_id" type="text" inputmode="numeric" placeholder="Например: 123456789" required />
            </label>
            <div class="actions">
              <button id="send_deeplink" class="btn" type="button">Отправить ссылку для входа</button>
            </div>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </section>

    <footer class="auth-footer">
      <div class="auth-footer__links">
        <a href="https://t.me/LunetVPNSupportBot" class="auth-footer__link" target="_blank" rel="noopener noreferrer">Техподдержка</a>
        <a href="/terms/" class="auth-footer__link">Пользовательское соглашение</a>
        <a href="/terms/privacy/" class="auth-footer__link">Политика конфиденциальности</a>
        <a href="/terms/offer/" class="auth-footer__link">Оферта</a>
      </div>
    </footer>
  </main>

  __API_BOOTSTRAP__
  <script defer src="/miniapp/cabinet-login.js?v=7"></script>
</body>
</html>
