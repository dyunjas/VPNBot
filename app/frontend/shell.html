<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Кабинет | Lunet</title>
  <meta name="description" content="Кабинет Lunet для управления подпиской, устройствами, платежами и профилем." />
  <link rel="icon" type="image/x-icon" href="/miniapp/assets/lunet-favicon.ico?v=7" />
  __SURFACE_STYLES__
  __HEAD_SCRIPTS__
</head>
<body>
  <div id="outside-stub" class="outside" style="display:none;">
    <div class="outside__card">
      <div class="outside__title">Мини-приложение доступно только в Telegram</div>
    </div>
  </div>

  <div id="banned-stub" class="outside" style="display:none;">
    <div class="outside__card">
      <div class="outside__title">Доступ ограничен</div>
      <p>Если это выглядит как ошибка, напишите в поддержку.</p>
    </div>
  </div>

  <div id="unavailable-stub" class="outside" style="display:none;">
    <div class="outside__card outside__card--server">
      <div class="outside__title">Сервер временно недоступен</div>
      <p>Внутренняя ошибка сервера. Попробуйте еще раз чуть позже.</p>
    </div>
  </div>

  <div id="app-root" class="app">
    <div id="alerts" class="alerts" aria-live="polite" aria-atomic="true"></div>

    <div class="cabinet-topbar">
      <div class="cabinet-topbar__brand">
        <img class="cabinet-topbar__brand-logo" src="/miniapp/assets/lunet-logo-sign.png" alt="Lunet" />
      </div>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
    </div>
    <button class="mobile-menu-backdrop" id="mobile-menu-backdrop" type="button" aria-label="Закрыть меню"></button>

    __APP_SHELL__
  </div>
  __APP_BOOTSTRAP__
</body>
</html>
