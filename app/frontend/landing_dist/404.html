<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f5" />
    <link rel="icon" href="/favicon.ico" />
    <title>Страница не найдена — Lunet</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18181b;background:#f4f4f5}
      *{box-sizing:border-box}body{margin:0;min-width:320px}
      .not-found-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f4f5}
      .not-found-card{width:min(100%,560px);padding:56px 48px;text-align:center;background:#fff;border:1px solid #e4e4e7;border-radius:20px;box-shadow:0 12px 32px #18181b12}
      .not-found-code{display:block;color:#71717a;font-size:14px;font-weight:400;letter-spacing:0}
      .not-found-card h1{margin:14px 0 12px;color:#18181b;font-size:36px;font-weight:400;line-height:1.2}
      .not-found-card p{max-width:380px;margin:0 auto 30px;color:#71717a;font-size:16px;line-height:1.5}
      .not-found-action{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #18181b;border-radius:10px;color:#fff;background:#18181b;font-size:15px;font-weight:600;line-height:1;text-decoration:none;box-shadow:none}
      .not-found-action:hover{color:#fff;background:#27272a;border-color:#27272a}
      @media(max-width:600px){.not-found-card{padding:42px 24px}.not-found-card h1{font-size:30px}}
    </style>
  </head>
  <body>
    <main class="not-found-page">
      <div class="not-found-card">
        <span class="not-found-code">404</span>
        <h1>Страница не найдена</h1>
        <p>Проверьте адрес или вернитесь на главную страницу Lunet.</p>
        <a class="not-found-action" href="/">Вернуться на главную</a>
      </div>
    </main>
  </body>
</html>
